# Builds the autodoc executable on each platform (PyInstaller can't cross-compile).
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# Each build is attached to the run as a downloadable archive containing an autodoc/
# folder with the executable and the example input/ folder. For tags, the archives
# are also published as a GitHub Release, which anyone can download without logging in.
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Read-only by default; only the release job gets write access
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller builds for the processor it runs on, so Macs need two builds
          - os: macos-latest
            artifact: autodoc-macos-apple-silicon
          - os: macos-15-intel
            artifact: autodoc-macos-intel
          - os: windows-latest
            artifact: autodoc-windows
          - os: ubuntu-latest
            artifact: autodoc-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build
        run: uv run python build.py

      - name: Assemble package folder
        shell: bash
        run: |
          mkdir -p package/autodoc
          cp dist/autodoc* package/autodoc/
          cp -r input package/autodoc/input

      # Artifacts are zipped on upload, which loses the executable bit, so package
      # the builds in archives that keep it
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent package/autodoc ${{ matrix.artifact }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C package autodoc

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path package/autodoc -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      # Put the archives from all build jobs into one folder
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Create the release if it doesn't exist yet, so re-running the workflow for the
      # same tag replaces the files instead of failing
      - name: Publish release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" release/* --clobber
